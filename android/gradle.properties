# Google Sign-In Web Client ID
# To configure:
# 1. Go to Google Cloud Console -> Credentials
# 2. Create OAuth 2.0 Web Client ID
# 3. Paste the value below (ends in .apps.googleusercontent.com)
# 4. Also configure in Supabase Dashboard -> Auth -> Providers -> Google
GOOGLE_WEB_CLIENT_ID=
